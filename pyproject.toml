[project]
name = "eclipse-processor"
version = "0.1.0"
description = "High-precision, 16-bit astronomical image processing pipeline for solar eclipse photography"
readme = "README.md"
authors = [
    { name = "Marc Torres Jimenez", email = "mtorres.form@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
    "tifffile>=2026.9.20",
    "tqdm>=4.70.1",
]

[project.scripts]
eclipse-processor = "eclipse_processor.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
